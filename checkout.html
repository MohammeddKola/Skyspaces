<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Crew</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; margin:0;">

<header style="background:#0f3460; color:white; padding:15px; text-align:center;">
  <h1>Checkout</h1>
</header>

<main style="max-width:900px;margin:30px auto;background:#fff;padding:20px;border-radius:8px">
  
  <div id="orderSummary"></div>
  <p style="text-align:right;font-weight:700">Total: ₹<span id="orderTotal">0</span></p>

  <h3>Billing Details</h3>
  <input id="custName" placeholder="Full name" required style="width:100%;padding:8px;margin:6px 0">
  <input id="custEmail" placeholder="Email" type="email" style="width:100%;padding:8px;margin:6px 0">
  <input id="custPhone" placeholder="Phone" type="tel" style="width:100%;padding:8px;margin:6px 0">
  <textarea id="custAddress" placeholder="Address" style="width:100%;padding:8px;margin:6px 0"></textarea>

  <button id="payBtn" style="padding:12px 18px;background:#0f3460;color:#fff;border:none;border-radius:6px;cursor:pointer">
    Pay Now
  </button>

  <!-- QR Code container for desktop -->
  <div id="qrContainer" style="text-align:center;margin-top:20px;display:none;"></div>
</main>

<script>
// ---------------------
// CART helpers
// ---------------------
function getCart() {
  return JSON.parse(localStorage.getItem('cart') || '[]');
}
function calcTotal(cart) {
  return cart.reduce((s, i) => s + (parseFloat(i.price) * (i.qty || 1)), 0).toFixed(2);
}

// ---------------------
// Render order summary
// ---------------------
function renderSummary() {
  const cart = getCart();
  const container = document.getElementById('orderSummary');
  container.innerHTML = '';
  if (cart.length === 0) {
    container.innerHTML = '<p>Your cart is empty.</p>';
    document.getElementById('orderTotal').textContent = '0';
    return;
  }
  cart.forEach(i => {
    const div = document.createElement('div');
    div.style.display = 'flex';
    div.style.justifyContent = 'space-between';
    div.style.padding = '8px 0';
    div.innerHTML = `<div>${i.name} × ${i.qty || 1}</div>
                     <div>₹${(parseFloat(i.price) * (i.qty || 1)).toFixed(2)}</div>`;
    container.appendChild(div);
  });
  document.getElementById('orderTotal').textContent = calcTotal(cart);
}
renderSummary();

// ---------------------
// Pay Now click
// ---------------------
document.getElementById('payBtn').addEventListener('click', () => {
  const cart = getCart();
  if (cart.length === 0) {
    alert('Your cart is empty.');
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!name || !email || !phone || !address) {
    alert('Please fill all billing details.');
    return;
  }

  const total = calcTotal(cart);
  const upiId = "kolamohammedhussain@oksbi"; // <-- Replace with your real UPI ID
  const shopName = "Skyspaces"; // <-- Your shop name
  const note = `Order by ${name}: ${cart.map(i => `${i.name} x${i.qty}`).join(', ')}`;

  // Create UPI payment link
  const upiLink = `upi://pay?pa=${encodeURIComponent("kolamohammedhussain@oksbi")}&pn=${encodeURIComponent(shopName)}&am=${encodeURIComponent(total)}&cu=INR&tn=${encodeURIComponent(note)}`;

  if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
    // Mobile → open in UPI app
    window.location.href = upiLink;
  } else {
    // Desktop → show QR code
    const qrContainer = document.getElementById('qrContainer');
    qrContainer.style.display = 'block';
    qrContainer.innerHTML = `
      <h3>Scan to Pay with Google Pay / PhonePe / Paytm</h3>
      <div id="qrCode" style="margin: 15px auto;"></div>
      <p style="margin-top:10px;font-weight:bold;">Amount: ₹${total}</p>
    `;

    new QRCode(document.getElementById('qrCode'), {
      text: upiLink,
      width: 200,
      height: 200
    });
  }
});
</script>
</body>
</html>
